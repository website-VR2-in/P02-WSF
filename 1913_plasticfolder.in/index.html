<!DOCTYPE html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0; url=/fr/">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #0e1420; color: #e9eef5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .box { text-align: center; max-width: 520px; }
    .cmyk { display: inline-flex; gap: 6px; margin-bottom: 18px; }
    .cmyk i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
    .cmyk .c { background: #00a6c0; } .cmyk .m { background: #e23a86; } .cmyk .y { background: #f2c200; } .cmyk .k { background: #fff; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 30px; margin-bottom: 10px; color: #fff; }
    p { color: #9fb0c3; font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
    a { color: #35c1dd; text-decoration: none; font-weight: 600; }
    .btn { display: inline-block; padding: 13px 26px; border-radius: 10px; background: #0e9db8; color: #fff; font-weight: 700; text-decoration: none; margin: 4px; }
    .btn.alt { background: transparent; border: 1px solid #2c3e55; color: #dbe6f0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="cmyk" aria-hidden="true"><i class="c"></i><i class="m"></i><i class="y"></i><i class="k"></i></div>
    <h1>PlasticFolder.in</h1>
    <p>Impression CMJN sur polypropylène recyclé — pochettes &amp; dossiers plastiques personnalisés, produits à Chennai, livrés en Europe et dans le monde. Vous allez être redirigé…</p>
    <a class="btn" href="/fr/">Version française</a>
    <a class="btn alt" href="/en/">English version</a>
  </div>
  <noscript><p style="margin-top:16px;">La redirection automatique est désactivée. <a href="/fr/">Version française</a> · <a href="/en/">English</a></p></noscript>
  <script>
    (function () {
      try {
        var l = (navigator.language || "fr").toLowerCase();
        location.replace(l.indexOf("en") === 0 ? "/en/" : "/fr/");
      } catch (e) { location.replace("/fr/"); }
    })();
  </script>
</body>
</html>
