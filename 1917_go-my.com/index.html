<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoMy — Redirection</title>
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="GoMy : votre centre de commandement personnel. Redirection vers la version française ou anglaise.">
  <link rel="alternate" hreflang="fr" href="https://go-my.com/fr/">
  <link rel="alternate" hreflang="en" href="https://go-my.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://go-my.com/fr/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316132e'/%3E%3Cpath d='M9 23 L21 11' stroke='%234f46e5' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M15 9.5 L21 9.5 L21 15.5' stroke='%234f46e5' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='24' r='3' fill='%23f59e0b'/%3E%3C/svg%3E">
  <style>
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#16132e; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .box { text-align:center; padding:32px; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:#c9c6e0; margin:0 0 20px; font-size:14.5px; }
    a { color:#a5b4fc; text-decoration:none; margin:0 8px; }
    .spin { width:34px; height:34px; border:3px solid #4f46e5; border-top-color:transparent; border-radius:50%; margin:0 auto 22px; animation:s 1s linear infinite; }
    @keyframes s { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <h1>GoMy</h1>
    <p>Redirection en cours…<br><em>Redirecting…</em></p>
    <p><a href="/fr/">Français</a> · <a href="/en/">English</a></p>
  </div>
  <script>
    (function () {
      var lang = (navigator.language || "fr").toLowerCase();
      var path = lang.indexOf("en") === 0 ? "/en/" : "/fr/";
      window.location.replace(path);
    })();
  </script>
</body>
</html>
