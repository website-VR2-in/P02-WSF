<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/en/">
  <link rel="canonical" href="https://salesclawai.com/en/">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "SalesClaw AI",
    "url": "https://salesclawai.com/",
    "inLanguage": ["en", "fr"]

<body>
  <p>Redirecting to the best language for you… <a href="/en/">English</a> · <a href="/fr/">Français</a></p>

  <script id="lang-redirect">
    (function(){
      var nav = (navigator.language || "en").toLowerCase();
      window.location.replace(nav.indexOf("fr") === 0 ? "/fr/" : "/en/");
    })();
  </script>
</body>
</html>
